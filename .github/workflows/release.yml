name: release

# 태그 push(v*) 시 전 플랫폼 abi3 휠 + sdist 를 만들어 PyPI 에 게시한다(Trusted Publishing).
# 빌드 feature 는 pyproject.toml 의 [tool.maturin] features = ["python"] 에서 읽는다.
#
# PyPI 쪽 Trusted Publisher 등록값과 아래 두 가지가 정확히 일치해야 게시가 통과한다.
#   Workflow name    = release.yml   (이 파일 이름)
#   Environment name = pypi          (release 잡의 environment)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 게시 전 관문. 이 레포는 지금까지 Windows 에서만 실측됐으므로,
  # 리눅스에서 테스트가 실제로 도는 것을 확인한 뒤에만 휠을 올린다.
  test:
    name: Test on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rust tests and lints
        run: |
          cargo test
          cargo test --features serde
          cargo test --features parallel
          # 파이썬 확장은 extension-module 이라 테스트 바이너리로 링크되지 않는다.
          # clippy 는 링크하지 않으므로 여기서 함께 본다.
          cargo clippy --all-targets --all-features -- -D warnings
          cargo fmt --all --check

      - name: Python binding tests
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip maturin pytest
          maturin develop
          pytest tests/test_python_binding.py

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # --zig 를 쓰지 않는다. zig 가 필요했던 형제 레포의 이유는 reqwest(rustls)가
          # 끌어오는 ring 의 ARM 어셈블리였는데, 이 레포는 네트워크 의존성이 0 이라
          # ring 자체가 들어오지 않는다.
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, linux, windows, macos, sdist]
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing(OIDC) — API 토큰 불필요
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
